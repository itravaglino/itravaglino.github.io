<!DOCTYPE html>
<html lang="en" data-page="trips">

    <meta charset="utf-8" />

    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="../src/trips.css" />
    <script>
      (function () {
        var lang = "en";
        try {
          var stored = localStorage.getItem("it-lang");
          if (stored === "es" || stored === "en") lang = stored;
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dataset.lang = lang;
        document.documentElement.classList.add("js");
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#trips-root" data-i18n="skip">Skip to content</a>
    <header class="site-header">

        <a class="mark" href="../">
          <span class="mark-it">IT</span>
          <span class="mark-name">Travaglino</span>
        </a>
        <div class="nav-cluster">
          <nav data-i18n-aria="nav.primary" aria-label="Primary">

            </ul>
          </nav>
          <div class="lang-switch" role="group" data-i18n-aria="nav.langGroup" aria-label="Language">
            <button type="button" data-lang-switch="es" aria-pressed="false" data-i18n-aria="nav.langEs">ES</button>
            <button type="button" data-lang-switch="en" aria-pressed="true" data-i18n-aria="nav.langEn">EN</button>

        <div id="trips-root" data-api=""></div>

    <footer class="site-footer">
